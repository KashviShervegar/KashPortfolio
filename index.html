<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --text: #f0ede8;
      --muted: #555;
      --accent: #e8e0d0;
      --dvd-w: 220px;
      --dvd-h: 120px;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
    }

    /* ── Grain overlay ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
      opacity: 0.35;
    }

    /* ── 404 badge ── */
    .badge {
      position: fixed;
      top: 2.2rem;
      left: 2.5rem;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .badge-code {
      font-family: 'Space Mono', monospace;
      font-size: clamp(3.5rem, 8vw, 6rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--text);
      /* Layered text shadow for depth */
      text-shadow:
        0 0 60px rgba(240,237,232,0.08),
        2px 2px 0 #1a1a1a,
        4px 4px 0 #111;
    }

    .badge-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .badge-sub {
      margin-top: 0.6rem;
      font-size: 0.82rem;
      color: #3a3a3a;
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1.6;
      max-width: 220px;
    }

    /* ── Decorative corner line ── */
    .corner-line {
      position: fixed;
      top: 0; left: 0;
      width: 1px;
      height: 100vh;
      background: linear-gradient(to bottom, transparent, #222 30%, #222 70%, transparent);
      margin-left: 1.6rem;
      z-index: 5;
    }

    /* ── DVD bouncing container ── */
    #dvd-wrap {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #dvd {
      position: absolute;
      width: var(--dvd-w);
      height: var(--dvd-h);
      will-change: transform;
      filter: drop-shadow(0 0 18px currentColor);
    }

    /* ── The SVG "logo" card ── */
    .dvd-card {
      width: 100%;
      height: 100%;
      border-radius: 6px;
    }

    /* ── Bottom status line ── */
    .status-bar {
      position: fixed;
      bottom: 1.6rem;
      left: 2.5rem;
      right: 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      border-top: 1px solid #1e1e1e;
      padding-top: 0.9rem;
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .status-dot::before {
      content: '';
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #c0392b;
      animation: pulse 2s ease-in-out infinite;
    }

    .status-time {
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      color: #2e2e2e;
      letter-spacing: 0.06em;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Contact info ── */
    .contacts {
      position: fixed;
      bottom: 4.2rem;
      left: 2.5rem;
      z-index: 10;
      display: flex;
      gap: 1.8rem;
    }

    .contact-item {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .contact-label {
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #333;
    }

    .contact-value {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: #666;
      letter-spacing: 0.04em;
    }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      .badge {
        left: 50%;
        transform: translateX(-50%);
        align-items: center;
        text-align: center;
        top: 2rem;
      }

      .badge-sub {
        text-align: center;
        max-width: 260px;
      }

      .corner-line { display: none; }

      .status-bar {
        left: 1.2rem;
        right: 1.2rem;
      }

      .contacts {
        left: 50%;
        transform: translateX(-50%);
        justify-content: center;
        gap: 2rem;
      }

      :root {
        --dvd-w: 170px;
        --dvd-h: 95px;
      }
    }
  </style>
</head>
<body>

  <div class="corner-line"></div>

  <!-- 404 Badge -->
  <div class="badge">
    <span class="badge-code">404</span>
    <span class="badge-label">Page not found</span>
    <p class="badge-sub">My portfolio is currently under construction.<br>Check back soon or contact me.</p>
  </div>

  <!-- DVD Bouncing Element -->
  <div id="dvd-wrap">
    <div id="dvd">
      <div class="dvd-card" id="dvd-card"></div>
    </div>
  </div>

  <!-- Contact Info -->
  <div class="contacts">
    <div class="contact-item">
      <span class="contact-label">Phone</span>
      <span class="contact-value">(425) 492-6964</span>
    </div>
    <div class="contact-item">
      <span class="contact-label">Email</span>
      <span class="contact-value">kashvi.shervegar@gmail.com</span>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-dot">Site offline</span>
    <span class="status-time" id="clock">--:--:--</span>
  </div>

  <script>
    // ── Clock ──
    const clock = document.getElementById('clock');
    function tick() {
      const now = new Date();
      clock.textContent = now.toTimeString().slice(0,8);
    }
    tick();
    setInterval(tick, 1000);

    // ── DVD Bounce Logic ──
    const dvd = document.getElementById('dvd');
    const card = document.getElementById('dvd-card');

    const W = () => window.innerWidth;
    const H = () => window.innerHeight;
    const dw = () => dvd.offsetWidth;
    const dh = () => dvd.offsetHeight;

    // Color palette — cycling on bounce
    const colors = [
      '#edbe15',
      '#04deb6',
      '#ba0237',
      '#68ba02',
      '#b989c4',
      '#d6550f',
    ];
    let colorIdx = 0;

    function applyColor(idx) {
      const c = colors[idx % colors.length];
      card.style.background = c;
      card.style.boxShadow = `0 0 28px ${c}88`;
    }

    // Starting position & velocity
    let x = Math.random() * (W() - 220);
    let y = Math.random() * (H() - 120);
    let vx = 1.6;
    let vy = 1.1;

    applyColor(colorIdx);

    let last = null;

    function step(ts) {
      if (!last) last = ts;
      const dt = Math.min(ts - last, 32); // cap delta
      last = ts;

      const speed = dt / 10;
      x += vx * speed;
      y += vy * speed;

      let bounced = false;
      if (x <= 0) { x = 0; vx = Math.abs(vx); bounced = true; }
      if (x + dw() >= W()) { x = W() - dw(); vx = -Math.abs(vx); bounced = true; }
      if (y <= 0) { y = 0; vy = Math.abs(vy); bounced = true; }
      if (y + dh() >= H()) { y = H() - dh(); vy = -Math.abs(vy); bounced = true; }

      if (bounced) {
        colorIdx++;
        applyColor(colorIdx);
      }

      dvd.style.left = x + 'px';
      dvd.style.top = y + 'px';

      requestAnimationFrame(step);
    }

    requestAnimationFrame(step);

    // Recompute on resize to prevent going off-screen
    window.addEventListener('resize', () => {
      x = Math.min(x, W() - dw());
      y = Math.min(y, H() - dh());
    });
  </script>
</body>
</html>
